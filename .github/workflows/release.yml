name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG_NAME#v}"

          if [[ -z "$TAG_NAME" || "$TAG_NAME" == "$VERSION" ]]; then
            echo "Release tags must use the v<version> format, for example v0.1.0." >&2
            exit 1
          fi

          git rev-parse "${TAG_NAME}^{commit}" >/dev/null

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE_P12_BASE64" || -z "$MACOS_CERTIFICATE_PASSWORD" || -z "$MACOS_KEYCHAIN_PASSWORD" ]]; then
            echo "Missing macOS signing secrets." >&2
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Package app
        env:
          DEPLOYBAR_BUILD_CONFIGURATION: release
          DEPLOYBAR_BUILD_NUMBER: ${{ github.run_number }}
          DEPLOYBAR_CODE_SIGN_IDENTITY: "Developer ID Application: Xiang Wu (4XHVAJRZ83)"
          DEPLOYBAR_VERSION: ${{ steps.version.outputs.version }}
        run: ./Scripts/package_app.sh

      - name: Verify signature
        run: |
          codesign --verify --deep --strict --verbose=2 .build/DeployBar.app
          codesign -dv --verbose=4 .build/DeployBar.app

      - name: Notarize app
        timeout-minutes: 70
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo "Missing Apple notarization secrets." >&2
            exit 1
          fi

          NOTARY_ZIP="$RUNNER_TEMP/DeployBar-notary.zip"
          ditto -c -k --keepParent .build/DeployBar.app "$NOTARY_ZIP"

          SUBMISSION_JSON="$(xcrun notarytool submit "$NOTARY_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json)"
          echo "$SUBMISSION_JSON"

          SUBMISSION_ID="$(printf '%s' "$SUBMISSION_JSON" | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')"
          DEADLINE=$((SECONDS + 3600))

          while true; do
            INFO_JSON="$(xcrun notarytool info "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --output-format json)"
            STATUS="$(printf '%s' "$INFO_JSON" | python3 -c 'import json, sys; print(json.load(sys.stdin)["status"])')"
            echo "Notarization status: $STATUS"

            case "$STATUS" in
              Accepted)
                break
                ;;
              Invalid|Rejected)
                xcrun notarytool log "$SUBMISSION_ID" \
                  --apple-id "$APPLE_ID" \
                  --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                  --team-id "$APPLE_TEAM_ID" || true
                exit 1
                ;;
            esac

            if (( SECONDS >= DEADLINE )); then
              echo "Timed out waiting for notarization submission $SUBMISSION_ID." >&2
              exit 1
            fi

            sleep 30
          done

          xcrun stapler staple .build/DeployBar.app
          xcrun stapler validate .build/DeployBar.app
          spctl --assess --type execute --verbose=4 .build/DeployBar.app

      - name: Archive app
        run: |
          mkdir -p dist
          ditto -c -k --keepParent .build/DeployBar.app "dist/DeployBar-${{ steps.version.outputs.version }}-macOS.zip"
          shasum -a 256 "dist/DeployBar-${{ steps.version.outputs.version }}-macOS.zip" > "dist/DeployBar-${{ steps.version.outputs.version }}-macOS.zip.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeployBar-${{ steps.version.outputs.version }}-macOS
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            gh release create "$TAG_NAME" dist/* --title "DeployBar $VERSION" --generate-notes
          fi
