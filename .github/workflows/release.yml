name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG_NAME#v}"

          if [[ -z "$TAG_NAME" || "$TAG_NAME" == "$VERSION" ]]; then
            echo "Release tags must use the v<version> format, for example v0.1.0." >&2
            exit 1
          fi

          git rev-parse "${TAG_NAME}^{commit}" >/dev/null

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE_P12_BASE64" || -z "$MACOS_CERTIFICATE_PASSWORD" || -z "$MACOS_KEYCHAIN_PASSWORD" ]]; then
            echo "Missing macOS signing secrets." >&2
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Package app
        env:
          DEPLOYBAR_BUILD_CONFIGURATION: release
          DEPLOYBAR_BUILD_NUMBER: ${{ github.run_number }}
          DEPLOYBAR_CODE_SIGN_IDENTITY: "Developer ID Application: Xiang Wu (4XHVAJRZ83)"
          DEPLOYBAR_VERSION: ${{ steps.version.outputs.version }}
        run: ./Scripts/package_app.sh

      - name: Verify signature
        run: |
          codesign --verify --deep --strict --verbose=2 .build/DeployBar.app
          codesign -dv --verbose=4 .build/DeployBar.app

      - name: Submit app for notarization
        id: notarization
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo "Missing Apple notarization secrets." >&2
            exit 1
          fi

          mkdir -p dist notarization
          SIGNED_ZIP="dist/DeployBar-${VERSION}-macOS-signed.zip"
          ditto -c -k --keepParent .build/DeployBar.app "$SIGNED_ZIP"

          SUBMISSION_JSON="$(xcrun notarytool submit "$SIGNED_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json)"
          echo "$SUBMISSION_JSON"

          SUBMISSION_ID="$(printf '%s' "$SUBMISSION_JSON" | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')"
          printf '%s\n' "$SUBMISSION_JSON" > notarization/submission.json
          printf '%s\n' "$SUBMISSION_ID" > notarization/submission-id.txt
          printf '%s\n' "${{ steps.version.outputs.tag_name }}" > notarization/tag-name.txt
          printf '%s\n' "$VERSION" > notarization/version.txt

          echo "submission_id=$SUBMISSION_ID" >> "$GITHUB_OUTPUT"
          echo "Submitted notarization request $SUBMISSION_ID. Run the Finish Notarization workflow after Apple marks it Accepted."

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeployBar-${{ steps.version.outputs.tag_name }}-signed
          path: |
            dist/DeployBar-${{ steps.version.outputs.version }}-macOS-signed.zip
            notarization/*
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### Notarization submitted"
            echo
            echo "- Tag: \`${{ steps.version.outputs.tag_name }}\`"
            echo "- Source run ID: \`${{ github.run_id }}\`"
            echo "- Submission ID: \`${{ steps.notarization.outputs.submission_id }}\`"
            echo "- Signed artifact: \`DeployBar-${{ steps.version.outputs.tag_name }}-signed\`"
            echo
            echo "Run the **Finish Notarization** workflow with this run ID after Apple accepts the submission."
          } >> "$GITHUB_STEP_SUMMARY"
