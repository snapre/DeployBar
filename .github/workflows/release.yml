name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    # Build and launch on the oldest supported GitHub macOS image so a release
    # cannot accidentally depend on the macOS 26 SDK or runtime behavior.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG_NAME#v}"

          if [[ -z "$TAG_NAME" || "$TAG_NAME" == "$VERSION" ]]; then
            echo "Release tags must use the v<version> format, for example v0.1.0." >&2
            exit 1
          fi

          git rev-parse "${TAG_NAME}^{commit}" >/dev/null

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check release secrets
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          DEPLOYBAR_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.DEPLOYBAR_SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "Missing HOMEBREW_TAP_TOKEN. Add a fine-grained token with Contents read/write access to snapre/homebrew-tap." >&2
            exit 1
          fi
          if [[ -z "$DEPLOYBAR_SPARKLE_PUBLIC_ED_KEY" ]]; then
            echo "Missing DEPLOYBAR_SPARKLE_PUBLIC_ED_KEY. Add the public EdDSA key generated by Sparkle." >&2
            exit 1
          fi
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "Missing SPARKLE_PRIVATE_KEY. Add the private EdDSA key exported by Sparkle for appcast signing." >&2
            exit 1
          fi

      - name: Test
        run: swift test

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE_P12_BASE64" || -z "$MACOS_CERTIFICATE_PASSWORD" || -z "$MACOS_KEYCHAIN_PASSWORD" ]]; then
            echo "Missing macOS signing secrets." >&2
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          DEVELOPER_ID_CA_PATH="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          curl -fsSLo "$DEVELOPER_ID_CA_PATH" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$DEVELOPER_ID_CA_PATH" -k "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Package app
        env:
          DEPLOYBAR_BUILD_CONFIGURATION: release
          DEPLOYBAR_BUILD_ARCHS: "arm64 x86_64"
          DEPLOYBAR_BUILD_NUMBER: ${{ github.run_number }}
          DEPLOYBAR_CODE_SIGN_IDENTITY: "Developer ID Application: Xiang Wu (4XHVAJRZ83)"
          DEPLOYBAR_CODE_SIGN_KEYCHAIN: ${{ runner.temp }}/app-signing.keychain-db
          DEPLOYBAR_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.DEPLOYBAR_SPARKLE_PUBLIC_ED_KEY }}
          DEPLOYBAR_VERSION: ${{ steps.version.outputs.version }}
        run: ./Scripts/package_app.sh

      - name: Verify signature
        run: |
          lipo .build/DeployBar.app/Contents/MacOS/DeployBar -verify_arch arm64 x86_64
          lipo -info .build/DeployBar.app/Contents/MacOS/DeployBar
          test "$(vtool -show-build .build/DeployBar.app/Contents/MacOS/DeployBar | awk '$1 == "minos" { print $2 }' | sort -u)" = "13.0"
          test "$(sips -g hasAlpha .build/DeployBar.app/Contents/Resources/DeployBar.icns | awk '/hasAlpha:/ { print $2 }')" = "yes"
          codesign --verify --deep --strict --verbose=2 .build/DeployBar.app
          codesign -dv --verbose=4 .build/DeployBar.app
          CERT_DIR="$(mktemp -d)"
          (
            cd "$CERT_DIR"
            codesign -d --extract-certificates "$GITHUB_WORKSPACE/.build/DeployBar.app"
          )
          test -f "$CERT_DIR/codesign0"
          security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db" || true
          codesign --verify --deep --strict --verbose=2 .build/DeployBar.app

      - name: Notarize app
        id: notarization
        timeout-minutes: 100
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo "Missing Apple notarization secrets." >&2
            exit 1
          fi

          mkdir -p dist
          SIGNED_ZIP="$RUNNER_TEMP/DeployBar-${VERSION}-macOS-signed.zip"
          ditto -c -k --keepParent .build/DeployBar.app "$SIGNED_ZIP"
          VERIFY_DIR="$(mktemp -d)"
          ditto -x -k "$SIGNED_ZIP" "$VERIFY_DIR"
          codesign --verify --deep --strict --verbose=2 "$VERIFY_DIR/DeployBar.app"

          NOTARY_LOG="$RUNNER_TEMP/notarytool-submit.log"
          set +e
          SUBMISSION_JSON="$(xcrun notarytool submit "$SIGNED_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 90m \
            --output-format json 2> "$NOTARY_LOG")"
          NOTARY_EXIT=$?
          set -e
          if [[ -s "$NOTARY_LOG" ]]; then
            cat "$NOTARY_LOG" >&2
          fi
          echo "$SUBMISSION_JSON"

          SUBMISSION_ID="$(printf '%s' "$SUBMISSION_JSON" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("id", ""))' 2>/dev/null || true)"
          STATUS="$(printf '%s' "$SUBMISSION_JSON" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("status", ""))' 2>/dev/null || true)"

          echo "submission_id=$SUBMISSION_ID" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          if [[ "$NOTARY_EXIT" -ne 0 ]]; then
            if [[ -n "$SUBMISSION_ID" ]]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" || true
            fi
            exit "$NOTARY_EXIT"
          fi

          case "$STATUS" in
            Accepted)
              ;;
            Invalid|Rejected)
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" || true
              exit 1
              ;;
            *)
              echo "Unexpected notarization status: ${STATUS:-unknown}" >&2
              exit 1
              ;;
          esac

          xcrun stapler staple .build/DeployBar.app
          xcrun stapler validate .build/DeployBar.app
          spctl --assess --type execute --verbose=4 .build/DeployBar.app

          ditto -c -k --keepParent .build/DeployBar.app "dist/DeployBar-${VERSION}-macOS.zip"
          shasum -a 256 "dist/DeployBar-${VERSION}-macOS.zip" > "dist/DeployBar-${VERSION}-macOS.zip.sha256"

      - name: Verify final archive and launch
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          VERIFY_DIR="$(mktemp -d)"
          ditto -x -k "dist/DeployBar-${VERSION}-macOS.zip" "$VERIFY_DIR"
          APP="$VERIFY_DIR/DeployBar.app"

          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          test "$(vtool -show-build "$APP/Contents/MacOS/DeployBar" | awk '$1 == "minos" { print $2 }' | sort -u)" = "13.0"
          test "$(sips -g hasAlpha "$APP/Contents/Resources/DeployBar.icns" | awk '/hasAlpha:/ { print $2 }')" = "yes"

          open -n "$APP"
          for attempt in {1..20}; do
            if pgrep -x DeployBar >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! pgrep -x DeployBar >/dev/null; then
            /usr/bin/log show --last 2m --style compact --predicate 'process == "DeployBar"' || true
            exit 1
          fi
          pkill -x DeployBar

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SPARKLE_GENERATE_APPCAST="$(find .build -path "*/Sparkle/bin/generate_appcast" -type f -print -quit)"
          if [[ -z "$SPARKLE_GENERATE_APPCAST" ]]; then
            echo "Could not find Sparkle generate_appcast under .build." >&2
            exit 1
          fi

          RELEASE_DIR="$RUNNER_TEMP/sparkle-appcast"
          SPARKLE_PRIVATE_KEY_FILE="$RUNNER_TEMP/sparkle_ed25519.key"
          mkdir -p "$RELEASE_DIR"
          cp "dist/DeployBar-${VERSION}-macOS.zip" "$RELEASE_DIR/"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$SPARKLE_PRIVATE_KEY_FILE"
          chmod 600 "$SPARKLE_PRIVATE_KEY_FILE"

          "$SPARKLE_GENERATE_APPCAST" \
            --ed-key-file "$SPARKLE_PRIVATE_KEY_FILE" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/" \
            --maximum-deltas 0 \
            "$RELEASE_DIR"

          cp "$RELEASE_DIR/appcast.xml" dist/appcast.xml
          test -s dist/appcast.xml

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeployBar-${{ steps.version.outputs.version }}-macOS
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG_NAME" dist/* --title "DeployBar $VERSION" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

      - name: Update Homebrew tap
        id: homebrew
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAP_REPO="snapre/homebrew-tap"
          TAP_BRANCH="main"
          CASK_PATH="Casks/deploybar.rb"
          FINAL_ZIP="dist/DeployBar-${VERSION}-macOS.zip"
          TAP_FILE_URL="https://github.com/${TAP_REPO}/blob/${TAP_BRANCH}/${CASK_PATH}"

          SHA256="$(shasum -a 256 "$FINAL_ZIP" | awk '{print $1}')"
          ENCODED_CASK="$RUNNER_TEMP/deploybar-cask.b64"
          ORIGINAL_CASK="$RUNNER_TEMP/deploybar-cask.original.rb"
          UPDATED_CASK="$RUNNER_TEMP/deploybar-cask.rb"

          gh api "repos/${TAP_REPO}/contents/${CASK_PATH}" --jq '.content' > "$ENCODED_CASK"
          base64 -D < "$ENCODED_CASK" > "$UPDATED_CASK"
          cp "$UPDATED_CASK" "$ORIGINAL_CASK"

          VERSION="$VERSION" SHA256="$SHA256" ruby -pi -e 'version = ENV.fetch("VERSION"); sha256 = ENV.fetch("SHA256"); $_ = "  version \"#{version}\"\n" if $_.match?(/^  version "/); $_ = "  sha256 \"#{sha256}\"\n" if $_.match?(/^  sha256 "/)' "$UPDATED_CASK"

          grep -q "  version \"${VERSION}\"" "$UPDATED_CASK"
          grep -q "  sha256 \"${SHA256}\"" "$UPDATED_CASK"

          echo "file_url=$TAP_FILE_URL" >> "$GITHUB_OUTPUT"
          if cmp -s "$ORIGINAL_CASK" "$UPDATED_CASK"; then
            echo "result=already up to date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT_SHA="$(gh api "repos/${TAP_REPO}/contents/${CASK_PATH}" --jq '.sha')"
          CONTENT="$(base64 < "$UPDATED_CASK" | tr -d '\n')"
          COMMIT_URL="$(gh api \
            --method PUT \
            "repos/${TAP_REPO}/contents/${CASK_PATH}" \
            -f message="Update DeployBar to v${VERSION}" \
            -f content="$CONTENT" \
            -f sha="$CURRENT_SHA" \
            -f branch="$TAP_BRANCH" \
            --jq '.commit.html_url')"

          echo "result=updated" >> "$GITHUB_OUTPUT"
          echo "commit_url=$COMMIT_URL" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Release published"
            echo
            echo "- Tag: \`${{ steps.version.outputs.tag_name }}\`"
            echo "- Notarization submission: \`${{ steps.notarization.outputs.submission_id }}\`"
            echo "- Status: \`${{ steps.notarization.outputs.status }}\`"
            echo "- Release: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag_name }}"
            echo "- Homebrew tap: ${{ steps.homebrew.outputs.result }} (${{ steps.homebrew.outputs.file_url }})"
          } >> "$GITHUB_STEP_SUMMARY"
