name: Finish Notarization

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.1"
        required: true
        type: string
      source_run_id:
        description: "Release workflow run ID that submitted notarization"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: finish-notarization-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  finish:
    name: Staple and publish release
    runs-on: macos-15

    steps:
      - name: Resolve version
        id: version
        env:
          TAG_NAME: ${{ github.event.inputs.tag }}
        run: |
          VERSION="${TAG_NAME#v}"

          if [[ -z "$TAG_NAME" || "$TAG_NAME" == "$VERSION" ]]; then
            echo "Release tags must use the v<version> format, for example v0.1.1." >&2
            exit 1
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download signed artifact
        uses: actions/download-artifact@v4
        with:
          name: DeployBar-${{ steps.version.outputs.tag_name }}-signed
          run-id: ${{ github.event.inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: notarization-artifact

      - name: Check notarization status
        id: status
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo "Missing Apple notarization secrets." >&2
            exit 1
          fi

          SUBMISSION_ID="$(tr -d '\n' < notarization-artifact/notarization/submission-id.txt)"
          INFO_JSON="$(xcrun notarytool info "$SUBMISSION_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json)"
          STATUS="$(printf '%s' "$INFO_JSON" | python3 -c 'import json, sys; print(json.load(sys.stdin)["status"])')"
          echo "$INFO_JSON"
          echo "submission_id=$SUBMISSION_ID" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          case "$STATUS" in
            Accepted)
              ;;
            Invalid|Rejected)
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" || true
              exit 1
              ;;
            *)
              echo "Notarization submission $SUBMISSION_ID is $STATUS. Re-run this workflow after Apple accepts it." >&2
              exit 1
              ;;
          esac

      - name: Staple app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SIGNED_ZIP="notarization-artifact/dist/DeployBar-${VERSION}-macOS-signed.zip"
          mkdir -p work dist

          ditto -x -k "$SIGNED_ZIP" work
          xcrun stapler staple work/DeployBar.app
          xcrun stapler validate work/DeployBar.app
          spctl --assess --type execute --verbose=4 work/DeployBar.app

          ditto -c -k --keepParent work/DeployBar.app "dist/DeployBar-${VERSION}-macOS.zip"
          shasum -a 256 "dist/DeployBar-${VERSION}-macOS.zip" > "dist/DeployBar-${VERSION}-macOS.zip.sha256"

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeployBar-${{ steps.version.outputs.version }}-macOS
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG_NAME" dist/* --title "DeployBar $VERSION" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

      - name: Summary
        run: |
          {
            echo "### Release published"
            echo
            echo "- Tag: \`${{ steps.version.outputs.tag_name }}\`"
            echo "- Notarization submission: \`${{ steps.status.outputs.submission_id }}\`"
            echo "- Status: \`${{ steps.status.outputs.status }}\`"
            echo "- Release: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
